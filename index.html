<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>六一儿童节 · 寻宝迷宫</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(145deg, #9aa9b1 0%, #7c8a96 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI Emoji', cursive, sans-serif;
            margin: 0;
            padding: 12px;
        }

        .game-container {
            background-color: #e9eef3;
            border-radius: 60px 60px 50px 50px;
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.2), inset 0 1px 4px rgba(255, 255, 240, 0.8);
            padding: 16px 16px 22px 16px;
            width: 100%;
            max-width: 540px;
            margin: auto;
            border: 3px solid #ffb56b;
            display: flex;
            flex-direction: column;
        }

        .info-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            background: #ffefc0;
            border-radius: 50px;
            padding: 6px 18px;
            margin-bottom: 15px;
            box-shadow: inset 0 1px 4px rgba(0,0,0,0.05), 0 4px 8px rgba(0,0,0,0.05);
            flex-shrink: 0;
        }
        .game-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #d45a2b;
            background: #fff3cf;
            padding: 2px 14px;
            border-radius: 40px;
            letter-spacing: 1px;
        }
        .timer-box {
            background: #2c3e2f;
            padding: 4px 14px;
            border-radius: 60px;
            color: #ffec9f;
            font-weight: bold;
            font-size: 1.2rem;
            font-family: monospace;
            box-shadow: inset 0 0 0 2px #ffda88, 0 2px 6px black;
        }
        .timer-box span {
            font-size: 1.4rem;
            letter-spacing: 2px;
        }

        .status {
            font-size: 0.9rem;
            font-weight: bold;
            color: #b45f2b;
            background: #fff3cf;
            border-radius: 2rem;
            padding: 6px 12px;
            margin-bottom: 12px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .canvas-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 16px;
            background: #e0d6c0;
            border-radius: 36px;
            padding: 8px;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.12);
            flex-shrink: 1;
            overflow: auto;
        }

        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 28px;
            box-shadow: 0 0 0 3px #d4b483, 0 10px 20px rgba(0, 0, 0, 0.2);
            background-color: #b0aa8a;
            cursor: pointer;
            width: auto;
            height: auto;
            max-width: 100%;
        }

        .button-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 6px 0 5px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .action-btn {
            background: #7bc5ae;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            padding: 8px 18px;
            border-radius: 60px;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 0 #458a73;
            transition: 0.05s linear;
            font-family: inherit;
            min-width: 105px;
            touch-action: manipulation;
        }

        .action-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #458a73;
        }

        .reset-btn {
            background: #f5a65b;
            box-shadow: 0 4px 0 #b35f1a;
        }

        .guide-text {
            text-align: center;
            font-size: 0.7rem;
            color: #5a3e22;
            margin-top: 12px;
            background: #fff0cf;
            border-radius: 30px;
            padding: 5px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .custom-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.65);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(3px);
        }
        .modal-content {
            background: #fff3cf;
            border-radius: 60px;
            padding: 28px 24px;
            text-align: center;
            max-width: 280px;
            width: 80%;
            border: 4px solid #ffb56b;
            box-shadow: 0 20px 30px rgba(0,0,0,0.3);
            animation: bounce 0.3s ease;
        }
        .modal-content p {
            font-size: 1.35rem;
            font-weight: bold;
            color: #d45a2b;
            margin: 10px 0;
        }
        .modal-content button {
            background: #f5a65b;
            border: none;
            font-size: 1.2rem;
            padding: 8px 28px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            margin-top: 18px;
            cursor: pointer;
            box-shadow: 0 3px 0 #b35f1a;
        }
        .modal-content button:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #b35f1a;
        }
        @keyframes bounce {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @media (max-width: 550px) {
            .game-title { font-size: 1.1rem; }
            .timer-box { font-size: 1rem; padding: 2px 12px; }
            .timer-box span { font-size: 1.2rem; }
            .action-btn { padding: 6px 14px; font-size: 0.9rem; min-width: 90px; }
            .modal-content p { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="info-header">
        <div class="game-title">🎁 儿童节寻宝</div>
        <div class="timer-box">⏱️ <span id="timerDisplay">--</span> 秒</div>
    </div>
    <div class="status" id="gameStatusText">
        <span>🐣</span> 滑动手指 帮宝贝找到礼物
    </div>

    <div class="canvas-wrapper">
        <canvas id="mazeCanvas"></canvas>
    </div>

    <div class="button-bar">
        <button class="action-btn reset-btn" id="newMazeBtn">🎲 新迷宫</button>
        <button class="action-btn" id="resetPositionBtn">🏠 回起点</button>
    </div>
    <div class="guide-text">
        ✨ 手指在迷宫里滑动 | 红色足迹✨<br>
        倒计时内抵达礼物盒即获胜！
    </div>
</div>

<script>
    (function(){
        // 迷宫尺寸：宽15 高23 (竖长复杂)
        const MAZE_WIDTH = 15;
        const MAZE_HEIGHT = 23;

        let CELL_SIZE = 0;
        let mazeGrid = [];
        let player = { x: 1, y: 1 };
        let friend = { x: -1, y: -1 };
        let visited = [];
        let gameActive = true;
        let victoryFlag = false;
        let timerInterval = null;
        let timeLeft = 0;

        // 固定小草点 (一经生成不再变化)
        let fixedGrassSpots = [];

        const canvas = document.getElementById('mazeCanvas');
        const ctx = canvas.getContext('2d');
        const statusDiv = document.getElementById('gameStatusText');
        const timerDisplaySpan = document.getElementById('timerDisplay');
        const newMazeBtn = document.getElementById('newMazeBtn');
        const resetPosBtn = document.getElementById('resetPositionBtn');

        let lastTouchGrid = null;
        let isTouching = false;

        // 弹窗
        function showModal(message, isVictory = true) {
            const existingModal = document.querySelector('.custom-modal');
            if (existingModal) existingModal.remove();

            const modalDiv = document.createElement('div');
            modalDiv.className = 'custom-modal';
            const modalContent = document.createElement('div');
            modalContent.className = 'modal-content';
            const msgPara = document.createElement('p');
            msgPara.innerText = message;
            const okBtn = document.createElement('button');
            okBtn.innerText = '再来一局';
            okBtn.addEventListener('click', () => {
                modalDiv.remove();
                resetGameNewMaze();
            });
            modalContent.appendChild(msgPara);
            modalContent.appendChild(okBtn);
            modalDiv.appendChild(modalContent);
            document.body.appendChild(modalDiv);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function getRandomTimer() {
            return Math.floor(Math.random() * 11) + 10; // 10~20秒
        }

        function startTimer(seconds) {
            stopTimer();
            timeLeft = seconds;
            timerDisplaySpan.innerText = timeLeft;
            timerInterval = setInterval(() => {
                if (!gameActive || victoryFlag) return;
                if (timeLeft <= 1) {
                    stopTimer();
                    if (!victoryFlag && gameActive) {
                        gameActive = false;
                        victoryFlag = false;
                        showModal("⏰ 时间用完了！\n再来一局吧", false);
                        statusDiv.innerHTML = `<span>💔</span> 倒计时结束... 新迷宫继续挑战`;
                        statusDiv.style.background = "#ffbb99";
                        drawMaze();
                    }
                } else {
                    timeLeft--;
                    timerDisplaySpan.innerText = timeLeft;
                }
            }, 1000);
        }

        function victoryCelebration() {
            if (victoryFlag) return;
            victoryFlag = true;
            gameActive = false;
            stopTimer();
            showModal("恭喜你找到礼物，六一儿童节快乐！", true);
            statusDiv.innerHTML = `<span>🏆🎁🏆</span> 找到礼物啦！点新迷宫继续寻宝`;
            statusDiv.style.background = "#ffd58c";
            drawMaze();
        }

        // ---------- 迷宫生成 (复杂) ----------
        function initEmptyGrid() {
            return Array(MAZE_HEIGHT).fill().map(() => Array(MAZE_WIDTH).fill(0));
        }

        function carvePassagesFrom(x, y, grid) {
            const dirs = [[0, -2], [0, 2], [-2, 0], [2, 0]];
            for (let i = dirs.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [dirs[i], dirs[j]] = [dirs[j], dirs[i]];
            }
            for (let [dx, dy] of dirs) {
                const nx = x + dx;
                const ny = y + dy;
                if (nx > 0 && nx < MAZE_WIDTH-1 && ny > 0 && ny < MAZE_HEIGHT-1 && grid[ny][nx] === 0) {
                    const midX = x + dx/2;
                    const midY = y + dy/2;
                    grid[ny][nx] = 1;
                    grid[midY][midX] = 1;
                    carvePassagesFrom(nx, ny, grid);
                }
            }
        }

        function addExtraComplexity(grid, chance = 0.3) {
            for (let y = 1; y < MAZE_HEIGHT-1; y++) {
                for (let x = 1; x < MAZE_WIDTH-1; x++) {
                    if (grid[y][x] === 0 && Math.random() < chance) {
                        let up = grid[y-1][x] === 1;
                        let down = grid[y+1][x] === 1;
                        let left = grid[y][x-1] === 1;
                        let right = grid[y][x+1] === 1;
                        if ((up && down) || (left && right)) {
                            grid[y][x] = 1;
                        } else if ((up && left) || (up && right) || (down && left) || (down && right)) {
                            if (Math.random() < 0.65) grid[y][x] = 1;
                        }
                    }
                }
            }
            for (let i = 0; i < 24; i++) {
                let x = 2 + Math.floor(Math.random() * (MAZE_WIDTH-4));
                let y = 2 + Math.floor(Math.random() * (MAZE_HEIGHT-4));
                if (grid[y][x] === 0 && grid[y-1][x] === 1 && grid[y+1][x] === 0 && grid[y][x-1] === 0 && grid[y][x+1] === 0) {
                    grid[y][x] = 1;
                } else if (grid[y][x] === 0 && grid[y][x-1] === 1 && grid[y][x+1] === 0 && grid[y-1][x] === 0 && grid[y+1][x] === 0) {
                    grid[y][x] = 1;
                }
            }
            for (let i=0;i<MAZE_HEIGHT;i++) { grid[i][0] = 0; grid[i][MAZE_WIDTH-1] = 0; }
            for (let i=0;i<MAZE_WIDTH;i++) { grid[0][i] = 0; grid[MAZE_HEIGHT-1][i] = 0; }
            grid[1][1] = 1;
        }

        function generateComplexMaze() {
            let grid = initEmptyGrid();
            grid[1][1] = 1;
            carvePassagesFrom(1, 1, grid);
            addExtraComplexity(grid, 0.35);
            grid[1][1] = 1;
            return grid;
        }

        // 固定小草点生成 (基于迷宫格子)
        function generateFixedGrassSpots(grid) {
            const spots = [];
            const grassProb = 0.42;
            const maxSpotsPerCell = 2;
            for (let row = 0; row < MAZE_HEIGHT; row++) {
                for (let col = 0; col < MAZE_WIDTH; col++) {
                    if (grid[row][col] === 1) {
                        const count = Math.random() < grassProb ? (Math.floor(Math.random() * maxSpotsPerCell) + 1) : 0;
                        for (let i = 0; i < count; i++) {
                            const offsetX = 4 + Math.random() * (CELL_SIZE - 8);
                            const offsetY = 4 + Math.random() * (CELL_SIZE - 8);
                            spots.push({ col, row, offsetX, offsetY });
                        }
                    }
                }
            }
            return spots;
        }

        function refreshFixedGrassSpots() {
            fixedGrassSpots = generateFixedGrassSpots(mazeGrid);
        }

        // BFS
        function getShortestPathLength(startX, startY, targetX, targetY, grid) {
            if (startX === targetX && startY === targetY) return 0;
            const queue = [{x: startX, y: startY, dist: 0}];
            const visitedBFS = Array(MAZE_HEIGHT).fill().map(() => Array(MAZE_WIDTH).fill(false));
            visitedBFS[startY][startX] = true;
            const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
            while (queue.length) {
                const {x, y, dist} = queue.shift();
                for (let [dx, dy] of dirs) {
                    const nx = x+dx, ny = y+dy;
                    if (nx>=0 && nx<MAZE_WIDTH && ny>=0 && ny<MAZE_HEIGHT && grid[ny][nx] === 1 && !visitedBFS[ny][nx]) {
                        if (nx === targetX && ny === targetY) return dist+1;
                        visitedBFS[ny][nx] = true;
                        queue.push({x: nx, y: ny, dist: dist+1});
                    }
                }
            }
            return 100;
        }

        function pickHiddenFriend(grid, startX, startY) {
            let pathCells = [];
            for (let row = 0; row < MAZE_HEIGHT; row++) {
                for (let col = 0; col < MAZE_WIDTH; col++) {
                    if (grid[row][col] === 1 && !(col === startX && row === startY)) {
                        pathCells.push({ x: col, y: row });
                    }
                }
            }
            for (let i = pathCells.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pathCells[i], pathCells[j]] = [pathCells[j], pathCells[i]];
            }
            let maxDist = -1;
            let farthest = [];
            for (let cell of pathCells) {
                const d = getShortestPathLength(startX, startY, cell.x, cell.y, grid);
                if (d > maxDist) {
                    maxDist = d;
                    farthest = [cell];
                } else if (d === maxDist) {
                    farthest.push(cell);
                }
            }
            if (farthest.length > 0) {
                const idx = Math.floor(Math.random() * farthest.length);
                return farthest[idx];
            }
            return pathCells[Math.floor(Math.random() * pathCells.length)];
        }

        function moveToAdjacent(targetX, targetY) {
            if (!gameActive || victoryFlag) return false;
            const dx = Math.abs(targetX - player.x);
            const dy = Math.abs(targetY - player.y);
            if ((dx + dy !== 1) || (mazeGrid[targetY][targetX] !== 1)) return false;
            player.x = targetX;
            player.y = targetY;
            if (!visited[player.y][player.x]) {
                visited[player.y][player.x] = true;
            }
            drawMaze();
            if (player.x === friend.x && player.y === friend.y && !victoryFlag) {
                victoryCelebration();
                drawMaze();
            }
            return true;
        }

        function resetGameNewMaze() {
            stopTimer();
            mazeGrid = generateComplexMaze();
            player.x = 1;
            player.y = 1;
            friend = pickHiddenFriend(mazeGrid, player.x, player.y);
            gameActive = true;
            victoryFlag = false;
            visited = Array(MAZE_HEIGHT).fill().map(() => Array(MAZE_WIDTH).fill(false));
            visited[player.y][player.x] = true;
            statusDiv.innerHTML = `<span>🐣🎁</span> 滑动手指 帮宝贝找到礼物`;
            statusDiv.style.background = "#fff3cf";
            resizeCanvasAndDraw();   // 内部会刷新固定草点并重绘
            const timerSec = getRandomTimer();
            startTimer(timerSec);
        }

        function resetPositionToStart() {
            if (!gameActive && victoryFlag === false) {
                showModal("游戏已经结束，点击再来一局吧", false);
                return;
            }
            if (victoryFlag) {
                resetGameNewMaze();
                return;
            }
            player.x = 1;
            player.y = 1;
            visited = Array(MAZE_HEIGHT).fill().map(() => Array(MAZE_WIDTH).fill(false));
            visited[player.y][player.x] = true;
            if (player.x === friend.x && player.y === friend.y) {
                friend = pickHiddenFriend(mazeGrid, player.x, player.y);
            }
            drawMaze();
        }

        // 绘图 (墙壁X使用与外墙相同的浅黄色)
        function drawMaze() {
            if (!mazeGrid.length) return;
            for (let row = 0; row < MAZE_HEIGHT; row++) {
                for (let col = 0; col < MAZE_WIDTH; col++) {
                    const x = col * CELL_SIZE;
                    const y = row * CELL_SIZE;
                    const isWall = (mazeGrid[row][col] === 0);
                    if (isWall) {
                        // 黄色墙壁
                        ctx.fillStyle = "#F3C969";
                        ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);
                        ctx.fillStyle = "#E0B04E";
                        ctx.fillRect(x+2, y+2, CELL_SIZE-4, CELL_SIZE-4);
                        // 绘制与外框颜色一致的浅黄色叉
                        ctx.beginPath();
                        ctx.strokeStyle = "#F3C969";   // 与墙壁主色完全相同
                        ctx.lineWidth = Math.max(2, CELL_SIZE * 0.12);
                        ctx.moveTo(x + 6, y + 6);
                        ctx.lineTo(x + CELL_SIZE - 6, y + CELL_SIZE - 6);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.moveTo(x + CELL_SIZE - 6, y + 6);
                        ctx.lineTo(x + 6, y + CELL_SIZE - 6);
                        ctx.stroke();
                    } else {
                        // 灰色地面
                        ctx.fillStyle = "#A89F8C";
                        ctx.fillRect(x, y, CELL_SIZE, CELL_SIZE);
                        ctx.fillStyle = "#928B77";
                        ctx.fillRect(x+1, y+1, CELL_SIZE-2, CELL_SIZE-2);
                    }
                }
            }

            // 绘制固定小草点 (不会闪烁)
            for (let spot of fixedGrassSpots) {
                const x = spot.col * CELL_SIZE + spot.offsetX;
                const y = spot.row * CELL_SIZE + spot.offsetY;
                ctx.fillStyle = `rgba(70, 110, 50, 0.8)`;
                ctx.beginPath();
                ctx.arc(x, y, 1.3, 0, Math.PI*2);
                ctx.fill();
            }

            // 纯红色足迹 (纯色圆点)
            for (let row = 0; row < MAZE_HEIGHT; row++) {
                for (let col = 0; col < MAZE_WIDTH; col++) {
                    if (visited[row][col] === true && mazeGrid[row][col] === 1) {
                        const x = col * CELL_SIZE;
                        const y = row * CELL_SIZE;
                        ctx.beginPath();
                        ctx.fillStyle = "#E34234";
                        ctx.arc(x + CELL_SIZE/2, y + CELL_SIZE/2, CELL_SIZE*0.22, 0, Math.PI*2);
                        ctx.fill();
                    }
                }
            }

            // 礼物盒 (好朋友)
            if (friend.x >= 0 && friend.y >= 0 && !(victoryFlag && player.x === friend.x && player.y === friend.y)) {
                const fx = friend.x * CELL_SIZE;
                const fy = friend.y * CELL_SIZE;
                ctx.save();
                ctx.fillStyle = "#FF6F61";
                ctx.beginPath();
                ctx.roundRect(fx+3, fy+3, CELL_SIZE-6, CELL_SIZE-6, 7);
                ctx.fill();
                ctx.fillStyle = "#FFD966";
                ctx.beginPath();
                ctx.roundRect(fx+CELL_SIZE/2-7, fy+4, 14, 9, 4);
                ctx.fill();
                ctx.fillStyle = "#FFFFFF";
                ctx.font = `${CELL_SIZE-8}px "Segoe UI Emoji"`;
                ctx.fillText("🎁", fx+CELL_SIZE/2-11, fy+CELL_SIZE/2+7);
                ctx.fillStyle = "#D43F1A";
                ctx.font = `bold ${CELL_SIZE-12}px "Segoe UI Emoji"`;
                ctx.fillText("⭐", fx+CELL_SIZE-12, fy+8);
                ctx.restore();
            } else if (friend.x >=0 && friend.y >=0 && victoryFlag && player.x === friend.x && player.y === friend.y) {
                const fx = friend.x * CELL_SIZE;
                const fy = friend.y * CELL_SIZE;
                ctx.fillStyle = "#F3B33D";
                ctx.beginPath();
                ctx.arc(fx+CELL_SIZE/2, fy+CELL_SIZE/2, CELL_SIZE/2-4, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = "#FF4290";
                ctx.font = `${CELL_SIZE-4}px "Segoe UI Emoji"`;
                ctx.fillText("🧸❤️", fx+CELL_SIZE/2-16, fy+CELL_SIZE/2+8);
            }

            // 玩家角色
            const px = player.x * CELL_SIZE;
            const py = player.y * CELL_SIZE;
            ctx.save();
            ctx.fillStyle = "#FADB67";
            ctx.beginPath();
            ctx.arc(px+CELL_SIZE/2, py+CELL_SIZE/2, CELL_SIZE/2-5, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = "#F39C12";
            ctx.beginPath();
            ctx.arc(px+CELL_SIZE/2-4, py+CELL_SIZE/2-4, 3, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(px+CELL_SIZE/2+4, py+CELL_SIZE/2-4, 3, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = "#7D3C1A";
            ctx.beginPath();
            ctx.ellipse(px+CELL_SIZE/2, py+CELL_SIZE/2+3, 5, 3, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = "#FFAAAA";
            ctx.beginPath();
            ctx.arc(px+CELL_SIZE/2-8, py+CELL_SIZE/2+3, 2.5, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(px+CELL_SIZE/2+8, py+CELL_SIZE/2+3, 2.5, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = "#E34234";
            ctx.beginPath();
            ctx.moveTo(px+CELL_SIZE-7, py+CELL_SIZE-7);
            ctx.lineTo(px+CELL_SIZE-2, py+CELL_SIZE-2);
            ctx.lineTo(px+CELL_SIZE-13, py+CELL_SIZE-2);
            ctx.fill();
            ctx.fillStyle = "#F4C542";
            ctx.font = `${CELL_SIZE-10}px "Segoe UI Emoji"`;
            ctx.fillText("⭐", px+CELL_SIZE-12, py+7);
            ctx.restore();

            if (victoryFlag && gameActive === false) {
                ctx.font = `bold ${Math.floor(CELL_SIZE*0.6)}px "Comic Neue"`;
                ctx.fillStyle = "#FF4488";
                ctx.shadowBlur = 0;
                ctx.fillText("🎉 找到礼物 🎉", canvas.width/2-80, 38);
            } else if (!gameActive && !victoryFlag) {
                ctx.font = `bold ${Math.floor(CELL_SIZE*0.6)}px "Comic Neue"`;
                ctx.fillStyle = "#A52A2A";
                ctx.fillText("⏰ 时间到啦 ⏰", canvas.width/2-85, 38);
            }
        }

        // 触摸滑动控制
        function getGridFromTouch(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const canvasX = (clientX - rect.left) * scaleX;
            const canvasY = (clientY - rect.top) * scaleY;
            if (canvasX < 0 || canvasX > canvas.width || canvasY < 0 || canvasY > canvas.height) return null;
            const gridX = Math.floor(canvasX / CELL_SIZE);
            const gridY = Math.floor(canvasY / CELL_SIZE);
            if (gridX < 0 || gridX >= MAZE_WIDTH || gridY < 0 || gridY >= MAZE_HEIGHT) return null;
            return { x: gridX, y: gridY };
        }

        function handleTouchStart(e) {
            e.preventDefault();
            if (!gameActive || victoryFlag) return;
            const touch = e.touches[0];
            const grid = getGridFromTouch(touch.clientX, touch.clientY);
            if (!grid) return;
            if ((grid.x === player.x && grid.y === player.y)) {
                lastTouchGrid = { x: player.x, y: player.y };
                isTouching = true;
            } else if (Math.abs(grid.x - player.x) + Math.abs(grid.y - player.y) === 1 && mazeGrid[grid.y][grid.x] === 1) {
                moveToAdjacent(grid.x, grid.y);
                lastTouchGrid = { x: player.x, y: player.y };
                isTouching = true;
            } else {
                lastTouchGrid = null;
                isTouching = false;
            }
        }

        function handleTouchMove(e) {
            e.preventDefault();
            if (!gameActive || victoryFlag) return;
            if (!isTouching) return;
            const touch = e.touches[0];
            const currentGrid = getGridFromTouch(touch.clientX, touch.clientY);
            if (!currentGrid) return;
            if (!lastTouchGrid) { lastTouchGrid = currentGrid; return; }
            if (currentGrid.x !== lastTouchGrid.x || currentGrid.y !== lastTouchGrid.y) {
                const dist = Math.abs(currentGrid.x - lastTouchGrid.x) + Math.abs(currentGrid.y - lastTouchGrid.y);
                if (dist === 1 && mazeGrid[currentGrid.y][currentGrid.x] === 1) {
                    if (Math.abs(currentGrid.x - player.x) + Math.abs(currentGrid.y - player.y) === 1) {
                        moveToAdjacent(currentGrid.x, currentGrid.y);
                        lastTouchGrid = { x: player.x, y: player.y };
                    } else { lastTouchGrid = currentGrid; }
                } else { lastTouchGrid = currentGrid; }
            }
        }

        function handleTouchEnd(e) { e.preventDefault(); isTouching = false; lastTouchGrid = null; }

        function resizeCanvasAndDraw() {
            const screenHeight = window.innerHeight;
            let otherHeight = 180;
            const header = document.querySelector('.info-header');
            const status = document.querySelector('.status');
            const buttons = document.querySelector('.button-bar');
            const guide = document.querySelector('.guide-text');
            if(header && status && buttons && guide) {
                otherHeight = header.offsetHeight + status.offsetHeight + buttons.offsetHeight + guide.offsetHeight + 50;
            }
            let maxCanvasHeight = Math.max(300, screenHeight - otherHeight - 30);
            const maxWidth = Math.min(window.innerWidth - 40, 540);
            let cellByWidth = Math.floor(maxWidth / MAZE_WIDTH);
            let cellByHeight = Math.floor(maxCanvasHeight / MAZE_HEIGHT);
            let finalSize = Math.min(cellByWidth, cellByHeight);
            if (finalSize < 22) finalSize = 22;
            CELL_SIZE = finalSize;
            canvas.width = CELL_SIZE * MAZE_WIDTH;
            canvas.height = CELL_SIZE * MAZE_HEIGHT;
            canvas.style.width = `${canvas.width}px`;
            canvas.style.height = `${canvas.height}px`;
            refreshFixedGrassSpots();
            if (mazeGrid.length) drawMaze();
        }

        function bindEvents() {
            newMazeBtn.addEventListener('click', () => { resetGameNewMaze(); });
            resetPosBtn.addEventListener('click', () => { resetPositionToStart(); });
            window.addEventListener('resize', () => { resizeCanvasAndDraw(); });
            canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
            canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
            canvas.addEventListener('touchend', handleTouchEnd);
            canvas.addEventListener('touchcancel', handleTouchEnd);
        }

        function init() {
            resetGameNewMaze();
            bindEvents();
        }

        init();
    })();
</script>
</body>
</html>
